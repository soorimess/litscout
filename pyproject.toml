[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litscout"
version = "0.1.0"
description = "Systematic literature review: seed finding, embedding-ranked snowballing with live stopping rules, LLM validation"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pymupdf>=1.23",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
litscout = "litscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litscout = ["dashboard/*.html"]
