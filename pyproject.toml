[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litscout"
version = "0.1.0"
description = "Systematic literature review: seed finding, embedding-ranked snowballing with live stopping rules, LLM validation"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pymupdf>=1.23",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
web = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<2.1",
  "bcrypt>=4.2,<5",
  "python-multipart>=0.0.20",
]

[project.scripts]
litscout = "litscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litscout = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
